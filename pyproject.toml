[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-x"
version = "0.1.0"
description = "Observation-only market dashboard: FastAPI + live SSE + no-build JS charts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "pyarrow>=14",
]

[project.optional-dependencies]
research = ["pandas>=2.0", "numpy>=1.26", "requests>=2.31", "websockets>=12", "defusedxml>=0.7"]
dev = ["pytest>=8", "anyio>=4"]

[project.scripts]
signal-x = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*", "signalx*"]

[tool.setuptools.package-data]
app = ["static/*.*", "static/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
